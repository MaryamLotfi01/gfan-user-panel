<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/main.css" />
    <title>Document</title>
  </head>
  <body class="max-w-[1920px] mx-auto">
    <header class="relative">
      <!-- Desktop Navbar -->
      <nav class="navbar">
        <!-- Logo Container -->
        <div class="h-full py-1 basis-1/5">
          <a href="#" class="h-full flex items-center">
            <img
              src="../img/logo type.png"
              alt=""
              class="md:h-2/3 lg:h-full transition-all duration-500" />
          </a>
        </div>
        <!-- Links Container -->
        <div class="nav-links-container">
          <a href="#" class="nav-link active">Home</a>
          <a href="#" class="nav-link">Services</a>
          <a href="#" class="nav-link">About Us</a>
          <a href="#" class="nav-link">Contact Us</a>
          <a href="#" class="nav-link">Blogs</a>
        </div>
        <!-- Login Container -->
        <div class="basis-1/5 flex items-center justify-end">
          <a href="#" class="login-btn">Login/Register</a>
        </div>
      </nav>
      <!-- Responsive Navbar -->
      <nav class="responsive-navbar" x-data="{isActiveSideBar:false}">
        <!-- Logo Container -->
        <div class="h-full">
          <a href="#" class="h-full">
            <img src="../img/logo type.png" class="h-full" alt="" />
          </a>
        </div>
        <!-- Side Bar -->
        <div>
          <!-- Side Bar Show Button -->
          <button class="flex flex-col gap-y-1 w-8" x-on:click="isActiveSideBar=true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-10">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          </button>
          <!-- Side Bar Container -->
          <div
            class="sidebar-container"
            x-bind:class="isActiveSideBar?'translate-x-0':'translate-x-full'">
            <div class="bg-white w-1/2 sm:w-1/3 flex flex-col p-4">
              <!-- Side Bar Hide Button -->
              <button x-on:click="isActiveSideBar=false">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-7">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
              </button>
              <!-- Side Bar Links -->
              <div class="flex flex-col gap-y-2 mt-4 text-content">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Services</a>
                <a href="#" class="nav-link">About Us</a>
                <a href="#" class="nav-link">Contact Us</a>
                <a href="#" class="nav-link">Blogs</a>
              </div>
              <!-- Login -->
              <a href="#" class="bg-primary py-2 text-white rounded-full mt-4 text-center"
                >Login/Register</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="mt-18">
      <section class="container h-10 border border-primary rounded-lg flex">
        <div class="basis-[30%] h-full bg-primary rounded-lg"></div>
        <div class="grow h-full"></div>
      </section>
    </main>

    <script>
      $(document).ready(() => {
        $(".faq-question").each((i, el) => {
          el.addEventListener("click", () => {
            let answerBox = el.nextElementSibling;
            $(answerBox).slideToggle();
